<style>
        .grid-bg {
            background-size: 40px 40px;
            background-image: 
                linear-gradient(to right, rgba(0, 0, 68, 0.1) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 0, 68, 0.1) 1px, transparent 1px);
        }
        
        /* Hard Shadows */
        .shadow-hard-gold { box-shadow: 4px 4px 0px 0px #CFA500; }
        .shadow-hard-blue { box-shadow: 4px 4px 0px 0px #000044; }
        
        /* Form Inputs Reset */
        input[type="text"], input[type="email"], select {
            appearance: none;
            border-radius: 0;
        }
        
        /* Checkbox Customization */
        input[type="checkbox"] {
            appearance: none;
            background-color: #fff;
            border: 2px solid #000044;
            width: 24px;
            height: 24px;
            display: inline-block;
            position: relative;
            cursor: pointer;
            border-radius: 0;
        }
        input[type="checkbox"]:checked {
            background-color: #900000;
            border-color: #000044;
        }
        input[type="checkbox"]:checked::after {
            content: '';
            position: absolute;
            left: 6px;
            top: 2px;
            width: 8px;
            height: 14px;
            border: solid white;
            border-width: 0 3px 3px 0;
            transform: rotate(45deg);
        }

        /* Radio Customization */
        input[type="radio"] {
            appearance: none;
            background-color: #fff;
            border: 2px solid #000044;
            width: 24px;
            height: 24px;
            display: inline-block;
            position: relative;
            cursor: pointer;
            border-radius: 0;
        }
        input[type="radio"]:checked {
            background-color: #fff;
            border: 4px solid #000044;
        }
        input[type="radio"]:checked::after {
            content: '';
            position: absolute;
            left: 3px;
            top: 3px;
            width: 10px;
            height: 10px;
            background-color: #900000;
        }

        .neo-input {
            width: 100%;
            border: 3px solid #000044;
            padding: 16px;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 16px;
            background: white;
            outline: none;
        }
        .neo-input:focus {
            box-shadow: 4px 4px 0px 0px #CFA500;
        }
        
        .section-header {
            background: #000044;
            color: white;
            padding: 8px 16px;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 3px solid #000044;
            display: inline-block;
            margin-bottom: 16px;
        }
    </style>

<body class="bg-surface-bright grid-bg min-h-screen text-on-surface font-body-md pb-[120px]">
<!-- Transactional TopAppBar (No Navigation/Icons) -->
<header class="sticky top-0 z-50 flex justify-center items-center h-[72px] bg-background border-b-[4px] border-brand-blue shadow-[4px_4px_0px_0px_#CFA500]">
<h1 class="font-headline-lg text-headline-lg tracking-tighter uppercase text-brand-red">OWSXI</h1>
</header>
<main class="p-margin-mobile flex flex-col gap-8 max-w-[600px] mx-auto">
<!-- Section 1: Contact -->
<section class="bg-white border-[3px] border-brand-blue p-6 shadow-hard-gold">
<div class="section-header">1. Contact</div>
<div class="flex flex-col gap-4">
<div>
<label class="block font-label-bold text-label-bold mb-2 uppercase text-brand-blue">Email Address</label>
<input class="neo-input" placeholder="you@edge-city.net" type="email" value="user@example.com">
</div>
<label class="flex items-center gap-3 cursor-pointer mt-2">
<input checked="" type="checkbox">
<span class="font-label-bold text-label-bold">Send me sticker drops &amp; news</span>
</label>
</div>
</section>
<!-- Section 2: Fulfillment -->
<section class="bg-white border-[3px] border-brand-blue p-6 shadow-hard-gold">
<div class="section-header">2. Fulfillment</div>
<div class="flex flex-col gap-6">
<!-- Delivery Methods -->
<div class="flex gap-4">
<label class="flex-1 flex flex-col items-center justify-center p-4 border-[3px] border-brand-blue bg-secondary-container cursor-pointer transition-transform active:translate-y-1 active:translate-x-1">
<input checked="" class="mb-2" name="fulfillment" type="radio">
<span class="font-label-bold text-label-bold uppercase">Ship To Me</span>
</label>
<label class="flex-1 flex flex-col items-center justify-center p-4 border-[3px] border-brand-blue bg-white hover:bg-surface-container cursor-pointer transition-transform active:translate-y-1 active:translate-x-1">
<input class="mb-2" name="fulfillment" type="radio">
<span class="font-label-bold text-label-bold uppercase text-center">Pickup Booth</span>
</label>
</div>
<!-- Shipping Address Form -->
<div class="flex flex-col gap-4">
<div>
<label class="block font-label-bold text-label-bold mb-2 uppercase text-brand-blue">Full Name</label>
<input class="neo-input" placeholder="J. Doe" type="text">
</div>
<div>
<label class="block font-label-bold text-label-bold mb-2 uppercase text-brand-blue">Street Address</label>
<input class="neo-input" placeholder="123 Neon Ave" type="text">
</div>
<div class="flex gap-4">
<div class="flex-1">
<label class="block font-label-bold text-label-bold mb-2 uppercase text-brand-blue">City</label>
<input class="neo-input" placeholder="Sector 4" type="text">
</div>
<div class="w-1/3">
<label class="block font-label-bold text-label-bold mb-2 uppercase text-brand-blue">Zip</label>
<input class="neo-input" placeholder="00000" type="text">
</div>
</div>
</div>
</div>
</section>
<!-- Section 3: Your Haul -->
<section class="bg-surface-container-highest border-[3px] border-brand-blue p-6 shadow-hard-blue">
<div class="section-header bg-brand-red border-brand-red">3. Your Haul</div>
<div class="flex items-center gap-4 border-b-[3px] border-brand-blue pb-4 mb-4">
<div class="w-20 h-20 bg-white border-[3px] border-brand-blue flex-shrink-0" data-alt="A highly detailed studio shot of a shiny, metallic holographic sticker pack on a stark white background. The packaging features bold brutalist typography and vibrant, iridescent colors reflecting harsh, high-contrast lighting. The aesthetic is 90s retro-pop meets modern streetwear." style="background-image: url(&quot;https://lh3.googleusercontent.com/aida-public/AB6AXuDbNkhGW8Lqg_i9fsupKomhNbpeFqj8r9a0XYgz4u3epvGfCB2h8oOmtr0oLrO1fhPLzswdDdUkw2DHQxUuqN3vryLNlwCo_AJ3mirKAcMMlUKxSW4WYZe0mWphO4o1qxlqpn82bQQmngrpYxM4ieJTh8b-KQyocdSujkUMxQDanZcaZu-vKTl6PL6ggbtQ_2f52MUxL5e39QCsxSKHbH1_7boQ4YGHXgb3f5zNufOLnO3hFUnNe8cf&quot;);"></div>
<div class="flex-grow">
<h3 class="font-headline-md text-headline-md uppercase text-brand-blue">Holo Cyber Pack</h3>
<p class="font-label-bold text-label-bold text-brand-red">Qty: 1</p>
</div>
<div class="font-headline-md text-headline-md text-brand-blue">$24.00</div>
</div>
<div class="flex flex-col gap-2 font-label-bold text-label-bold uppercase">
<div class="flex justify-between">
<span>Subtotal</span>
<span>$24.00</span>
</div>
<div class="flex justify-between">
<span>Shipping</span>
<span>$5.00</span>
</div>
<div class="flex justify-between mt-2 pt-2 border-t-[3px] border-brand-blue font-headline-md text-headline-md text-brand-red">
<span>Total</span>
<span>$29.00</span>
</div>
</div>
</section>
<!-- Section 4: Payment -->
<section class="bg-white border-[3px] border-brand-blue p-6 shadow-hard-gold">
<div class="section-header">4. Payment</div>
<div class="flex flex-col gap-6">
<!-- Payment Methods -->
<div class="flex flex-col gap-3">
<label class="flex items-center p-4 border-[3px] border-brand-blue bg-secondary-container cursor-pointer">
<input checked="" class="mr-4" name="payment" type="radio">
<span class="font-headline-md text-headline-md uppercase flex-grow">Scan to Pay</span>
<span class="material-symbols-outlined text-[32px]">qr_code_scanner</span>
</label>
<label class="flex items-center p-4 border-[3px] border-brand-blue bg-white hover:bg-surface-container cursor-pointer">
<input class="mr-4" name="payment" type="radio">
<span class="font-headline-md text-headline-md uppercase flex-grow">Credit Card</span>
<span class="material-symbols-outlined text-[32px]">credit_card</span>
</label>
</div>
<!-- QR Scan Area -->
<div class="border-[3px] border-brand-blue p-6 flex flex-col items-center justify-center bg-surface-container-highest text-center">
<div class="w-48 h-48 bg-white border-[3px] border-brand-blue mb-4 flex items-center justify-center" data-alt="A stark, high-contrast, black and white QR code centered on a clean white background, surrounded by a thick, heavy dark blue border. The design is utilitarian, flat, and perfectly aligned with a neo-brutalist aesthetic, devoid of any soft shadows or rounded corners." style="background-image: url(&quot;https://lh3.googleusercontent.com/aida-public/AB6AXuCJkjGxfGhGsamEXqYRVUXont5qz3Vbl0i61Un_dhJyl7g-oDGn7s73yzBj508vrNRSSEvlFqlRYfL9osB5uDW73VE-y5ersWrOCs-hACKE5fSJtpd5ASmhYn-iI63-r7C7v4RLZFaettV2UWAHosHUSoxBvINXaXNmPbZpbCGljhfhwrzzmHQ-mPk8VRWg6pNJ7c1V1lGW3a0XDTqpSiOfu9tIEJl1FtYeq_U9DiFRevQwDSWeJKav&quot;);">
<!-- Pseudo QR Code Pattern -->
<div class="w-full h-full p-4 grid grid-cols-4 grid-rows-4 gap-1 bg-black opacity-10">
<!-- Just visual texture -->
</div>
</div>
<p class="font-label-bold text-label-bold uppercase text-brand-blue">Scan with GCash, maya or qrph to complete instantly.</p>
</div>
</div>
</section>
</main>
<!-- Sticky Bottom Action Bar -->
<div class="fixed bottom-0 left-0 w-full z-50 p-margin-mobile bg-surface-container-highest border-t-[4px] border-brand-blue shadow-[0px_-4px_0px_0px_#CFA500]">
<button class="w-full bg-brand-red text-white border-[3px] border-brand-blue py-4 font-headline-md text-headline-md uppercase tracking-wide shadow-hard-gold transition-transform active:translate-y-1 active:translate-x-1 active:shadow-none flex justify-between px-6">
<span>Complete Order</span>
<span>$29.00</span>
</button>
</div>


</body></html>
