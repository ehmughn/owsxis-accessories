<style>
        body {
            background-color: #fdf9f5;
            background-image: 
                linear-gradient(#e5e2de 1px, transparent 1px),
                linear-gradient(90deg, #e5e2de 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .brutalist-shadow {
            box-shadow: 6px 6px 0px 0px #1c1c19;
        }
        .brutalist-border {
            border: 4px solid #1c1c19;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 700, 'GRAD' 0, 'opsz' 24;

    body {
      min-height: max(884px, 100dvh);
    }

  </head>
<body class="min-h-screen flex items-center justify-center p-4 overflow-x-hidden font-body-md text-on-surface">
<!-- Floating Background Elements -->
<div class="fixed top-10 left-10 w-16 h-16 bg-tertiary-container brutalist-border -z-10 animate-bounce" style="animation-duration: 3s;"></div>
<div class="fixed bottom-20 right-5 w-20 h-8 bg-secondary-container brutalist-border -z-10 rotate-12"></div>
<div class="fixed top-1/4 -right-4 w-12 h-12 bg-primary brutalist-border -z-10 rotate-45"></div>
<main class="w-full max-w-[400px] relative">
<!-- Main Login Card -->
<div class="bg-surface brutalist-border brutalist-shadow p-6 md:p-8 flex flex-col gap-6 relative overflow-hidden">
<!-- Shared Component Header Logic (Modified for Focused View) -->
<div class="flex flex-col items-center gap-2">
<div class="bg-primary p-3 brutalist-border text-on-primary">
<span class="material-symbols-outlined !text-3xl">shield_person</span>
</div>
<h1 class="font-headline-lg text-4xl uppercase tracking-tighter text-on-surface">OWSXI</h1>
<div class="bg-tertiary px-3 py-1 brutalist-border">
<p class="font-label-bold text-xs uppercase text-on-tertiary">Admin Control Panel</p>
</div>
</div>
<!-- Login Form -->
<form class="flex flex-col gap-5 mt-4" onsubmit="return false;">
<!-- Email Field -->
<div class="flex flex-col gap-2">
<label class="font-label-bold text-sm uppercase tracking-wide">Admin Email</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-on-surface">mail</span>
<input class="w-full brutalist-border h-14 pl-12 pr-4 bg-surface-bright focus:ring-0 focus:outline-none focus:bg-white text-lg font-body-md placeholder:opacity-50" placeholder="admin@owsxi.secure" type="email">
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-2">
<label class="font-label-bold text-sm uppercase tracking-wide">Secure Password</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-on-surface">lock</span>
<input class="w-full brutalist-border h-14 pl-12 pr-4 bg-surface-bright focus:ring-0 focus:outline-none focus:bg-white text-lg font-body-md placeholder:opacity-50" placeholder="••••••••" type="password">
</div>
<a class="font-label-bold text-xs text-primary underline self-end uppercase hover:text-on-primary-fixed-variant" href="#">Forgot Password?</a>
</div>
<!-- Action Button -->
<button class="mt-4 bg-primary text-on-primary brutalist-border h-16 flex items-center justify-between px-6 font-headline-lg text-xl uppercase transition-transform active:translate-x-1 active:translate-y-1 active:shadow-none hover:bg-primary-container" type="submit">
<span>Sign In</span>
<span class="material-symbols-outlined">arrow_forward</span>
</button>
</form>
<!-- Card Footer -->
<div class="border-t-2 border-outline-variant pt-4 flex items-center justify-center gap-2 opacity-70">
<span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1;">verified_user</span>
<span class="font-label-bold text-[10px] uppercase tracking-widest">Secure Access Only</span>
</div>
<!-- Decorative corner accent -->
<div class="absolute -top-6 -left-6 w-12 h-12 bg-secondary rotate-45 border-r-4 border-b-4 border-on-surface"></div>
</div>
<!-- Support Info -->
<div class="mt-8 text-center px-4">
<p class="font-body-md text-xs text-on-surface-variant leading-tight">
                This system is for authorized Owsxi personnel only. All access attempts are logged and monitored. IP: 192.168.1.XXX
            </p>
</div>
<!-- Animated Micro-interaction: Mouse Follower (Hidden on Mobile, but good for Tablet/Desktop hover) -->
<div class="hidden md:block fixed pointer-events-none z-50 w-8 h-8 border-2 border-primary bg-transparent mix-blend-difference" id="cursor-tracker" style="transition: transform 0.1s ease-out;"></div>
</main>
<!-- Visual Polish: Decorative Brand Image -->
<div class="fixed bottom-0 left-0 w-full h-1/4 opacity-10 pointer-events-none -z-20 overflow-hidden">
<div class="w-full h-full bg-no-repeat bg-bottom bg-contain" data-alt="A repetitive architectural pattern featuring hard industrial edges, raw concrete textures, and bold geometric shadows. The aesthetic is ultra-modern Neo-Nostalgia Brutalism with a high-contrast lighting setup in a light mode environment. Deep shadows emphasize the zero-roundness architecture, and subtle grid lines are visible in the background, reinforcing the orderly yet aggressive design system." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAJrd55rShyAtTr7OyvP_uD3ixDElL4SgounL2ICmjcLx3TZnGPnFgLOc6j4DXZk3nR6nkC9avdutWdp16CK32wFD2R0wnjGLquQx5DfDtbWUhZ3hI17EuLMB2600PjYAUycfrS6Nb4UHFa41wDNWVJVSPTZK7SqEXo63PqmH2czLwAuIjPdrDLdXyXGD23kDvuUH35MbzynlPN7pTH2ZsE6_DrunPlKpz0mp09bx0ecZ6TPc326o4C')">
</div>
</div>
<script>
        // Simple cursor tracker for desktop/tablet micro-interaction
        document.addEventListener('mousemove', (e) => {
            const tracker = document.getElementById('cursor-tracker');
            if (tracker) {
                tracker.style.transform = `translate(${e.clientX - 16}px, ${e.clientY - 16}px)`;
            }
        });

        // Micro-interaction for inputs
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.parentElement.style.transform = 'translate(-2px, -2px)';
                input.parentElement.parentElement.style.transition = 'transform 0.1s ease-out';
            });
            input.addEventListener('blur', () => {
                input.parentElement.parentElement.style.transform = 'translate(0, 0)';
            });
        });
    </script>
</body></html>
