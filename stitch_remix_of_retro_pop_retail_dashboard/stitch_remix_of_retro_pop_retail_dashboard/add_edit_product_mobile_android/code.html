<style>
        .brutalist-input {
            border: 4px solid #0f1250;
            background-color: #ffffff;
            color: #1c1c19;
            padding: 12px;
            width: 100%;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 16px;
            font-weight: 700;
            outline: none;
            transition: all 0.2s;
        }
        .brutalist-input:focus {
            box-shadow: 4px 4px 0px 0px #d0a602;
            transform: translate(-2px, -2px);
        }
        
        .brutalist-card {
            border: 4px solid #0f1250;
            background-color: #ffffff;
            box-shadow: 4px 4px 0px 0px #0f1250;
        }
        
        .brutalist-btn-primary {
            border: 4px solid #0f1250;
            background-color: #d0a602;
            color: #0f1250;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            text-transform: uppercase;
            box-shadow: 4px 4px 0px 0px #0f1250;
            transition: all 0.1s;
            cursor: pointer;
        }
        .brutalist-btn-primary:active {
            transform: translate(4px, 4px);
            box-shadow: none;
        }

        .brutalist-btn-secondary {
            border: 4px solid #0f1250;
            background-color: #ffffff;
            color: #0f1250;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            text-transform: uppercase;
            box-shadow: 4px 4px 0px 0px #900000;
            transition: all 0.1s;
            cursor: pointer;
        }
        .brutalist-btn-secondary:active {
            transform: translate(4px, 4px);
            box-shadow: none;
        }
        
        .tag-sticker {
            border: 3px solid #0f1250;
            background-color: #e0e0ff;
            color: #0f1250;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            padding: 4px 8px;
            display: inline-block;
            transform: rotate(-2deg);
            box-shadow: 2px 2px 0px 0px #ffffff, 4px 4px 0px 0px #0f1250;
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md pb-[100px] min-h-screen">
<!-- Top Navigation -->
<header class="flex justify-between items-center px-margin-mobile py-sm sticky top-0 z-50 bg-background border-b-[4px] border-secondary shadow-[4px_4px_0px_0px_#d0a602]">
<button class="flex items-center justify-center p-2 border-[4px] border-on-secondary-fixed bg-surface-container-highest hover:bg-tertiary-container transition-all active:translate-x-[2px] active:translate-y-[2px] active:shadow-none shadow-[2px_2px_0px_0px_#0f1250]">
<span class="material-symbols-outlined text-on-secondary-fixed">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-black tracking-tighter text-primary uppercase">Edit Product</h1>
<div class="w-10"></div> <!-- Spacer for balance -->
</header>
<main class="p-margin-mobile flex flex-col gap-md">
<!-- Basic Info Section -->
<section class="brutalist-card p-sm flex flex-col gap-sm">
<h2 class="font-headline-md text-headline-md bg-secondary text-on-secondary p-xs inline-block border-[3px] border-on-secondary-fixed uppercase w-fit mb-sm shadow-[2px_2px_0px_0px_#d0a602] transform">Basic Info</h2>
<div>
<label class="font-label-bold text-label-bold text-on-secondary-fixed block mb-xs">Product Title</label>
<input class="brutalist-input" type="text" value="Holographic Star Sticker Pack">
</div>
<div>
<label class="font-label-bold text-label-bold text-on-secondary-fixed block mb-xs">Description</label>
<!-- Faux Rich Text Toolbar -->
<div class="border-[4px] border-b-0 border-on-secondary-fixed bg-surface-container-highest flex gap-xs p-xs">
<button class="p-1 hover:bg-secondary-fixed border-[2px] border-transparent hover:border-on-secondary-fixed"><span class="material-symbols-outlined text-sm">format_bold</span></button>
<button class="p-1 hover:bg-secondary-fixed border-[2px] border-transparent hover:border-on-secondary-fixed"><span class="material-symbols-outlined text-sm">format_italic</span></button>
<button class="p-1 hover:bg-secondary-fixed border-[2px] border-transparent hover:border-on-secondary-fixed"><span class="material-symbols-outlined text-sm">link</span></button>
</div>
<textarea class="brutalist-input min-h-[120px] resize-y">A pack of 5 super shiny, holographic star stickers. Perfect for laptops, notebooks, or anywhere you want to stick 'em! Water resistant but not completely waterproof.</textarea>
</div>
</section>
<!-- Media Section -->
<section class="brutalist-card p-sm flex flex-col gap-sm">
<h2 class="font-headline-md text-headline-md bg-primary text-on-primary p-xs inline-block border-[3px] border-on-secondary-fixed uppercase w-fit mb-sm shadow-[2px_2px_0px_0px_#0f1250] transform">Media</h2>
<div class="grid grid-cols-2 gap-sm">
<!-- Main Image -->
<div class="border-[4px] border-on-secondary-fixed relative group aspect-square">
<img class="w-full h-full object-cover" data-alt="A close up shot of a holographic star shaped sticker reflecting rainbow colors on a dark background, bright and highly detailed macro photography, pop art style." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDXGQbsBmU5jZ-A5JcyeeIkIOc364huL88JUcNb3lZFWOpqRVt94WSREzefBvZVrJ8K2H2E8yiD_iloMUIbHLZbk3sZwX-Eg5KUfgNs2-bBLyWrC8_Oplk0MoF1LwEKiFHkrHNlMLPZIR2f2xUw2e6W9MCqiNloOMbSoeAUslcu0icy7tT_KKb2-NDuIUoPBCpa1WQqK8CcWyhiycR88Q6-X9B--WEOQw_V2XOhwnCulOVMh-s6x-RN">
<button class="absolute top-2 right-2 bg-error text-on-error border-[3px] border-on-secondary-fixed p-1 shadow-[2px_2px_0px_0px_#0f1250] hover:translate-y-[-2px] transition-transform z-10">
<span class="material-symbols-outlined">delete</span>
</button>
<div class="absolute bottom-0 left-0 bg-on-secondary-fixed text-white font-label-bold text-xs p-1 w-full text-center">MAIN</div>
</div>
<!-- Upload Placeholder -->
<button class="border-[4px] border-dashed border-on-secondary-fixed bg-surface-container-low flex flex-col items-center justify-center aspect-square hover:bg-surface-variant transition-colors cursor-pointer group">
<span class="material-symbols-outlined text-on-secondary-fixed text-4xl group-hover:scale-110 transition-transform">add_photo_alternate</span>
<span class="font-label-bold text-label-bold text-on-secondary-fixed mt-2">ADD MORE</span>
</button>
</div>
</section>
<!-- Pricing & Inventory Section -->
<section class="brutalist-card p-sm flex flex-col gap-sm">
<h2 class="font-headline-md text-headline-md bg-tertiary-container text-on-tertiary-container p-xs inline-block border-[3px] border-on-secondary-fixed uppercase w-fit mb-sm shadow-[2px_2px_0px_0px_#900000] transform">Pricing &amp; Stock</h2>
<div class="grid grid-cols-2 gap-sm">
<div>
<label class="font-label-bold text-label-bold text-on-secondary-fixed block mb-xs">Price ($)</label>
<input class="brutalist-input" step="0.01" type="number" value="4.99">
</div>
<div>
<label class="font-label-bold text-label-bold text-on-secondary-fixed block mb-xs">Compare at ($)</label>
<input class="brutalist-input" step="0.01" type="number" value="6.00">
</div>
</div>
<div>
<label class="font-label-bold text-label-bold text-on-secondary-fixed block mb-xs">SKU (Stock Keeping Unit)</label>
<input class="brutalist-input" type="text" value="STK-HOLO-STAR-01">
</div>
<div class="border-[4px] border-on-secondary-fixed p-sm mt-2 relative overflow-hidden">
<!-- Diagonal stripes background pattern -->
<div class="absolute inset-0 pointer-events-none" style="background-image: repeating-linear-gradient(45deg, rgb(15, 18, 80), rgb(15, 18, 80) 10px, transparent 10px, transparent 20px);"></div>
<h3 class="font-headline-md text-headline-md text-on-secondary-fixed uppercase mb-2 relative z-10">Stock Status</h3>
<div class="flex items-center gap-sm relative z-10">
<div class="flex-1 bg-white border-[4px] border-on-secondary-fixed p-2 text-center shadow-[2px_2px_0px_0px_#d0a602]">
<span class="font-label-bold text-lg text-primary block">15</span>
<span class="font-label-sm uppercase text-on-surface-variant">Units Left</span>
</div>
<div class="flex-1 flex flex-col gap-2">
<button class="border-[3px] border-on-secondary-fixed bg-surface-container-highest p-1 font-label-bold text-sm hover:bg-tertiary-container transition-colors flex items-center justify-center gap-1">
<span class="material-symbols-outlined text-sm">add</span> Adjust
                         </button>
<!-- Example Out of Stock state indicator (hidden by default, shown for example) -->
<div class="hidden border-[3px] border-error bg-error-container text-error p-1 font-label-bold text-sm text-center uppercase shadow-[2px_2px_0px_0px_#93000a] transform rotate-1">
                             Out of Stock!
                         </div>
</div>
</div>
</div>
</section>
<!-- Organization Section -->
<section class="brutalist-card p-sm flex flex-col gap-sm">
<h2 class="font-headline-md text-headline-md bg-secondary-container text-on-secondary-container p-xs inline-block border-[3px] border-on-secondary-fixed uppercase w-fit mb-sm shadow-[2px_2px_0px_0px_#0f1250] transform">Organization</h2>
<div>
<label class="font-label-bold text-label-bold text-on-secondary-fixed block mb-xs">Category</label>
<div class="relative">
<select class="brutalist-input appearance-none rounded-none w-full cursor-pointer">
<option>Stickers</option>
<option>Prints</option>
<option>Apparel</option>
<option>Accessories</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-on-secondary-fixed border-l-[4px] border-on-secondary-fixed bg-tertiary-container">
<span class="material-symbols-outlined">arrow_drop_down</span>
</div>
</div>
</div>
<div>
<label class="font-label-bold text-label-bold text-on-secondary-fixed block mb-xs">Tags</label>
<input class="brutalist-input mb-2" placeholder="Add tag and press enter..." type="text">
<div class="flex flex-wrap gap-2 mt-2">
<span class="tag-sticker flex items-center gap-1">holographic <button class="hover:text-error"><span class="material-symbols-outlined text-[14px]">close</span></button></span>
<span class="tag-sticker flex items-center gap-1 transform">stars <button class="hover:text-error"><span class="material-symbols-outlined text-[14px]">close</span></button></span>
<span class="tag-sticker flex items-center gap-1 transform">stationery <button class="hover:text-error"><span class="material-symbols-outlined text-[14px]">close</span></button></span>
</div>
</div>
</section>
<!-- Actions -->
<div class="flex gap-sm mt-md mb-xl">
<button class="brutalist-btn-secondary flex-1 py-3 text-center bg-white">Discard</button>
<button class="brutalist-btn-primary flex-[2] py-3 text-center text-lg flex items-center justify-center gap-2 font-black">
<span class="material-symbols-outlined">save</span> Save Product
            </button>
</div>
</main>
<!-- Bottom Navigation Bar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-margin-mobile py-sm bg-background border-t-[4px] border-secondary shadow-[0px_-4px_0px_0px_#d0a602] pb-safe md:hidden">
<a class="flex flex-col items-center justify-center text-on-surface-variant p-xs hover:bg-surface-container-high active:scale-95 transition-transform w-16" href="#">
<span class="material-symbols-outlined mb-1">dashboard</span>
<span class="font-label-sm text-[10px] uppercase font-bold tracking-tighter truncate w-full text-center">Dashboard</span>
</a>
<a class="flex flex-col items-center justify-center bg-tertiary-container text-on-tertiary-container border-[3px] border-secondary shadow-[2px_2px_0px_0px_#0f1250] p-xs active:scale-95 transition-transform w-16 transform -translate-y-2" href="#">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: &quot;FILL&quot; 1;">inventory_2</span>
<span class="font-label-sm text-[10px] uppercase font-bold tracking-tighter truncate w-full text-center text-primary-container">Inventory</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant p-xs hover:bg-surface-container-high active:scale-95 transition-transform w-16" href="#">
<span class="material-symbols-outlined mb-1">shopping_cart</span>
<span class="font-label-sm text-[10px] uppercase font-bold tracking-tighter truncate w-full text-center">Orders</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant p-xs hover:bg-surface-container-high active:scale-95 transition-transform w-16" href="#">
<span class="material-symbols-outlined mb-1">perm_media</span>
<span class="font-label-sm text-[10px] uppercase font-bold tracking-tighter truncate w-full text-center">Media</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant p-xs hover:bg-surface-container-high active:scale-95 transition-transform w-16" href="#">
<span class="material-symbols-outlined mb-1">group</span>
<span class="font-label-sm text-[10px] uppercase font-bold tracking-tighter truncate w-full text-center">account<br></span>
</a>
</nav>




</body></html>
