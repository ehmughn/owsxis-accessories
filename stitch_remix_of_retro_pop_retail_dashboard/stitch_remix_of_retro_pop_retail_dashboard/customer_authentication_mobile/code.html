<style>
        /* Light grid pattern for background */
        .bg-grid-pattern {
            background-image: 
                linear-gradient(to right, var(--tw-colors-outline-variant) 1px, transparent 1px),
                linear-gradient(to bottom, var(--tw-colors-outline-variant) 1px, transparent 1px);
            background-size: 24px 24px;
            background-position: center top;
        }
        /* Override form input defaults for neo-brutalism */
        input[type="email"], input[type="password"] {
            box-shadow: 2px 2px 0px 0px var(--tw-colors-on-secondary-fixed);
            border-radius: 0;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        input[type="email"]:focus, input[type="password"]:focus {
            outline: none;
            box-shadow: 4px 4px 0px 0px var(--tw-colors-tertiary-container);
            transform: translate(-2px, -2px);
        }
        input[type="checkbox"] {
            border-radius: 0;
            border: 2px solid var(--tw-colors-on-secondary-fixed);
        }
        input[type="checkbox"]:checked {
            background-color: var(--tw-colors-primary-container);
            border-color: var(--tw-colors-on-secondary-fixed);
        }
    </style>
</head>
<body class="bg-surface text-on-surface bg-grid-pattern min-h-screen flex flex-col font-body-md overflow-x-hidden selection:bg-tertiary-container selection:text-on-tertiary-container">
<!-- TopAppBar -->
<header class="w-full sticky top-0 z-50 flex items-center px-margin-mobile h-16 bg-surface border-b-[4px] border-secondary shadow-[0_4px_0_0_#b5b9fe] justify-center">

<div class="font-headline-lg-mobile text-headline-lg-mobile font-extrabold text-primary tracking-tighter uppercase">
            OWSXI
        </div>

</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col px-margin-mobile pt-sm pb-xl relative">
<!-- Brand Illustration Area -->
<div class="w-full h-48 border-[3px] border-on-secondary-fixed mb-md bg-secondary-container relative overflow-hidden shadow-[4px_4px_0_0_#0f1250]">
<div class="w-full h-full bg-cover bg-center" data-alt="A highly stylized, chaotic 90s retro-pop illustration featuring a stylized urban character spray-painting a bright red exclamation mark on a deep navy brick wall. The art style is bold, hard-edged, with thick black outlines and flat vibrant colors like bright gold and deep crimson, heavily influenced by indie-sleaze and sticker-slap aesthetics. High contrast and loud visual noise." style="background-image: url(&quot;https://lh3.googleusercontent.com/aida/AP1WRLvZvvy1cMNK_lnDYCGlRjl6mr1544dOl3xbuo49Ze_lQDx2OXUnqObMXtDPkGyY-yShCKne3t8F-PFR4gxDaSU3aw3NnR6DqyqgCafaZkJs9jdu6kzZ4EfVweVRkSEOmSizDcg5rn-5m7uQITlFPw_1JHCzEsP4nVSukgxvOEI2-wwygHggL0tKVZSdiF8iqBzXRPQlAnfovLWxAc10DB5Y02NSCZNIoXUVyc_mQA7RC1xtiuVjpmdfHRWvu-EcbRCT6lSxRSYblQ&quot;);"></div>
<!-- Decorative sticker -->
<div class="absolute top-2 right-2 bg-tertiary-container border-[3px] border-on-secondary-fixed px-3 py-1 font-label-bold text-label-bold text-on-secondary-fixed shadow-[2px_2px_0_0_#0f1250] uppercase z-10">
                Authorized
            </div>
</div>
<!-- Auth Container -->
<div class="w-full bg-surface-container border-[4px] border-on-secondary-fixed shadow-[4px_4px_0_0_#0f1250] flex flex-col relative z-10">
<!-- Tabs (Sign In / Create Account) -->
<div class="flex border-b-[4px] border-on-secondary-fixed">
<button class="flex-1 py-4 bg-primary-container text-on-primary font-headline-md text-headline-md border-r-[4px] border-on-secondary-fixed uppercase hover:bg-primary transition-colors">
                    Sign In
                </button>
<button class="flex-1 py-4 bg-surface text-on-surface-variant font-headline-md text-headline-md uppercase hover:bg-surface-variant transition-colors">
                    Create
                </button>
</div>
<!-- Form Area -->
<form class="flex flex-col p-md gap-md">
<div class="flex flex-col gap-xs">
<label class="font-label-bold text-label-bold uppercase tracking-widest text-on-secondary-fixed" for="email">Email</label>
<input class="w-full bg-surface border-[3px] border-on-secondary-fixed p-3 font-body-md text-on-surface uppercase placeholder-on-surface-variant/50 focus:ring-0" id="email" placeholder="YOUR@EMAIL.COM" type="email">
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-bold text-label-bold uppercase tracking-widest text-on-secondary-fixed" for="password">Password</label>
<input class="w-full bg-surface border-[3px] border-on-secondary-fixed p-3 font-body-md text-on-surface placeholder-on-surface-variant/50 focus:ring-0" id="password" placeholder="••••••••" type="password">
</div>
<div class="flex justify-between items-center mt-xs">
<label class="flex items-center gap-2 cursor-pointer group">
<input class="w-5 h-5 text-primary-container focus:ring-0 focus:ring-offset-0 cursor-pointer" type="checkbox">
<span class="font-label-bold text-label-sm text-on-surface-variant group-hover:text-on-surface transition-colors">STAY STICKY</span>
</label>
<a class="font-label-bold text-label-sm text-primary-container underline decoration-2 underline-offset-4 hover:text-primary transition-colors" href="#">Forgot?</a>
</div>
<!-- Primary Action Button -->
<button class="mt-sm w-full bg-tertiary-container border-[3px] border-on-secondary-fixed py-4 font-headline-md text-headline-md uppercase text-on-secondary-fixed shadow-[4px_4px_0_0_#0f1250] hover:translate-x-[2px] hover:translate-y-[2px] hover:shadow-[2px_2px_0_0_#0f1250] active:translate-x-[4px] active:translate-y-[4px] active:shadow-none transition-all duration-100 flex items-center justify-center gap-2" type="button">
                    Enter Shop
                    <span class="material-symbols-outlined font-bold" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
</div>
</main>
<!-- BottomNavBar -->



</body></html>
