<style>
        /* Base Reset & Custom Inputs */
        input[type="text"], input[type="number"], textarea, select {
            border-radius: 0 !important;
        }
        
        /* Hard Shadows */
        .shadow-hard-gold {
            box-shadow: 4px 4px 0px 0px #d0a602;
        }
        .shadow-hard-navy {
            box-shadow: 4px 4px 0px 0px #0f1250;
        }
        .shadow-hard-red {
            box-shadow: 4px 4px 0px 0px #900000;
        }
        
        /* Form Element Styles */
        .owsxi-input {
            width: 100%;
            border: 3px solid #0f1250;
            background-color: #ffffff;
            padding: 12px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 16px;
            color: #1c1c19;
            box-shadow: 4px 4px 0px 0px #0f1250;
            transition: all 0.1s ease-in-out;
        }
        .owsxi-input:focus {
            outline: none;
            box-shadow: 2px 2px 0px 0px #0f1250;
            transform: translate(2px, 2px);
        }

        .owsxi-btn-primary {
            width: 100%;
            border: 3px solid #0f1250;
            background-color: #900000;
            color: #ffffff;
            padding: 16px;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            text-transform: uppercase;
            box-shadow: 4px 4px 0px 0px #d0a602;
            transition: all 0.1s ease-in-out;
            cursor: pointer;
        }
        .owsxi-btn-primary:active {
            box-shadow: 0px 0px 0px 0px #d0a602;
            transform: translate(4px, 4px);
        }

        .owsxi-btn-secondary {
            width: 100%;
            border: 3px solid #0f1250;
            background-color: #ffffff;
            color: #0f1250;
            padding: 16px;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            text-transform: uppercase;
            box-shadow: 4px 4px 0px 0px #0f1250;
            transition: all 0.1s ease-in-out;
            cursor: pointer;
        }
        .owsxi-btn-secondary:active {
            box-shadow: 0px 0px 0px 0px #0f1250;
            transform: translate(4px, 4px);
        }
        
        .owsxi-label {
            display: block;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 14px;
            color: #0f1250;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        
        /* Grid Background Pattern */
        .bg-grid-pattern {
            background-image: 
                linear-gradient(to right, #e5e2de 1px, transparent 1px),
                linear-gradient(to bottom, #e5e2de 1px, transparent 1px);
            background-size: 20px 20px;
        }
    </style>

<body class="bg-surface text-on-surface min-h-screen pb-[100px] bg-grid-pattern relative">
<!-- TopAppBar -->
<header class="w-full top-0 sticky bg-surface dark:bg-surface-dim border-b-4 border-on-secondary-fixed dark:border-on-secondary-fixed-variant shadow-[4px_4px_0px_0px_#d0a602] z-40">
<div class="flex justify-between items-center w-full px-margin-mobile h-16">
<button class="text-on-surface-variant hover:bg-tertiary-fixed dark:hover:bg-tertiary-container transition-colors p-2 active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all border-2 border-transparent">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<h1 class="font-headline-md text-headline-md font-extrabold text-primary dark:text-primary-fixed-dim tracking-tighter uppercase">OWSXI ADMIN</h1>
<button class="text-on-surface-variant hover:bg-tertiary-fixed dark:hover:bg-tertiary-container transition-colors p-2 active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all border-2 border-transparent">
<span class="material-symbols-outlined" data-icon="search">search</span>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="w-full max-w-[1200px] mx-auto p-margin-mobile md:p-margin-desktop mt-4">
<!-- Page Title -->
<div class="mb-8 border-b-4 border-on-secondary-fixed pb-4 flex items-center justify-between">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile uppercase text-on-secondary-fixed tracking-tight">EDIT PRODUCT</h2>
<div class="bg-primary-fixed px-3 py-1 border-2 border-on-secondary-fixed shadow-hard-navy font-label-bold text-label-bold">
                ID: 8492
            </div>
</div>
<form class="space-y-8">
<!-- Image Section -->
<div class="flex flex-col space-y-2">
<label class="owsxi-label">Product Image</label>
<div class="relative w-full aspect-square md:aspect-video md:h-64 bg-surface-container-highest border-4 border-on-secondary-fixed overflow-hidden group shadow-hard-navy">
<img alt="Product placeholder image showing retro stickers" class="object-cover w-full h-full" src="https://lh3.googleusercontent.com/aida/AP1WRLvZvvy1cMNK_lnDYCGlRjl6mr1544dOl3xbuo49Ze_lQDx2OXUnqObMXtDPkGyY-yShCKne3t8F-PFR4gxDaSU3aw3NnR6DqyqgCafaZkJs9jdu6kzZ4EfVweVRkSEOmSizDcg5rn-5m7uQITlFPw_1JHCzEsP4nVSukgxvOEI2-wwygHggL0tKVZSdiF8iqBzXRPQlAnfovLWxAc10DB5Y02NSCZNIoXUVyc_mQA7RC1xtiuVjpmdfHRWvu-EcbRCT6lSxRSYblQ">
<div class="absolute inset-0 bg-on-secondary-fixed/50 flex flex-col items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity cursor-pointer">
<span class="material-symbols-outlined text-surface text-[48px] mb-2" data-icon="add_photo_alternate">add_photo_alternate</span>
<span class="font-label-bold text-surface uppercase">Change Image</span>
</div>
</div>
</div>
<!-- Bento Form Grid -->
<div class="grid grid-cols-1 md:grid-cols-12 gap-6">
<!-- Basic Info (Spans 12 on mobile, 8 on desktop) -->
<div class="md:col-span-8 space-y-6 bg-surface-container-lowest p-6 border-4 border-on-secondary-fixed shadow-hard-navy">
<div>
<label class="owsxi-label" for="product-name">Product Name</label>
<input class="owsxi-input" id="product-name" type="text" value="Retro Heart Sticker">
</div>
<div>
<label class="owsxi-label" for="product-description">Description</label>
<textarea class="owsxi-input" id="product-description" rows="4">Holographic vinyl die-cut sticker featuring a 90s inspired broken heart design with pixelated edges.</textarea>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<div>
<label class="owsxi-label" for="product-category">Category</label>
<select class="owsxi-input appearance-none bg-[url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2224%22%20height%3D%2224%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%230f1250%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpolyline%20points%3D%226%209%2012%2015%2018%209%22%3E%3C%2Fpolyline%3E%3C%2Fsvg%3E')] bg-no-repeat bg-[position:calc(100%-12px)_center]" id="product-category">
<option selected="" value="stickers">Stickers</option>
<option value="pins">Pins</option>
<option value="keychains">Keychains</option>
<option value="accessories">Accessories</option>
</select>
</div>
<div>
<label class="owsxi-label" for="product-sku">SKU</label>
<input class="owsxi-input font-mono" id="product-sku" type="text" value="STK-RH-001">
</div>
</div>
</div>
<!-- Pricing & Inventory (Spans 12 on mobile, 4 on desktop) -->
<div class="md:col-span-4 space-y-6 bg-secondary-fixed p-6 border-4 border-on-secondary-fixed shadow-hard-red">
<div>
<label class="owsxi-label" for="product-price">Price (USD)</label>
<div class="relative">
<span class="absolute left-4 top-1/2 -translate-y-1/2 font-label-bold text-on-secondary-fixed">$</span>
<input class="owsxi-input pl-8" id="product-price" step="0.01" type="number" value="4.50">
</div>
</div>
<div>
<label class="owsxi-label" for="product-stock">Stock Level</label>
<div class="flex items-center space-x-2">
<button class="w-12 h-12 flex-shrink-0 bg-surface border-3 border-on-secondary-fixed shadow-hard-navy flex items-center justify-center active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all" type="button">
<span class="material-symbols-outlined" data-icon="remove">remove</span>
</button>
<input class="owsxi-input text-center" id="product-stock" type="number" value="142">
<button class="w-12 h-12 flex-shrink-0 bg-tertiary-container border-3 border-on-secondary-fixed shadow-hard-navy flex items-center justify-center active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all" type="button">
<span class="material-symbols-outlined text-surface" data-icon="add">add</span>
</button>
</div>
</div>
<div class="pt-4 border-t-2 border-on-secondary-fixed border-dashed">
<label class="owsxi-label mb-4">Status</label>
<label class="relative inline-flex items-center cursor-pointer w-full">
<input checked="" class="sr-only peer" type="checkbox" value="">
<div class="w-full h-12 bg-surface-container-highest border-3 border-on-secondary-fixed peer-focus:outline-none shadow-hard-navy peer-checked:after:translate-x-[calc(100%-8px)] after:content-[''] after:absolute after:top-[6px] after:left-[6px] after:bg-on-secondary-fixed after:border-2 after:border-on-secondary-fixed after:h-9 after:w-[calc(50%-6px)] after:transition-all peer-checked:bg-secondary-container flex items-center justify-between px-4">
<span class="font-label-bold text-xs z-10 mix-blend-difference text-surface">OUT OF STOCK</span>
<span class="font-label-bold text-xs z-10 text-on-secondary-fixed mix-blend-overlay">IN STOCK</span>
</div>
</label>
</div>
</div>
</div>
<!-- Actions Area -->
<div class="mt-8 space-y-4 pt-8 border-t-4 border-on-secondary-fixed">
<button class="owsxi-btn-primary" type="button">SAVE CHANGES</button>
<button class="owsxi-btn-secondary" type="button">DISCARD CHANGES</button>
<div class="flex justify-center mt-8">
<button class="flex items-center text-error font-label-bold uppercase border-b-2 border-error hover:bg-error-container p-2 transition-colors" type="button">
<span class="material-symbols-outlined mr-2 text-[18px]" data-icon="delete">delete</span>
                        DELETE PRODUCT
                    </button>
</div>
</div>
</form>
</main>
<!-- BottomNavBar (Mobile Only) -->
<nav class="fixed bottom-0 w-full z-50 rounded-none border-t-4 border-on-secondary-fixed dark:border-on-secondary-fixed-variant bg-surface shadow-[0px_-4px_0px_0px_#900000] fixed bottom-0 left-0 w-full h-20 flex justify-around items-stretch md:hidden">
<a class="flex flex-col items-center justify-center text-on-surface-variant h-full w-full hover:bg-surface-container-high transition-colors active:scale-95 transition-transform" href="#">
<span class="material-symbols-outlined mb-1" data-icon="dashboard">dashboard</span>
<span class="font-label-sm text-label-sm">Dashboard</span>
</a>
<!-- Active Tab: Inventory -->
<a class="flex flex-col items-center justify-center bg-tertiary-container text-on-tertiary-container h-full w-full border-x-2 border-on-secondary-fixed hover:bg-surface-container-high transition-colors active:scale-95 transition-transform" href="#">
<span class="material-symbols-outlined mb-1 font-bold" data-icon="inventory_2" style="font-variation-settings: 'FILL' 1;">inventory_2</span>
<span class="font-label-sm text-label-sm font-bold">Inventory</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant h-full w-full hover:bg-surface-container-high transition-colors active:scale-95 transition-transform" href="#">
<span class="material-symbols-outlined mb-1" data-icon="shopping_cart">shopping_cart</span>
<span class="font-label-sm text-label-sm">Orders</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant h-full w-full hover:bg-surface-container-high transition-colors active:scale-95 transition-transform" href="#">
<span class="material-symbols-outlined mb-1" data-icon="perm_media">perm_media</span>
<span class="font-label-sm text-label-sm">Media</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant h-full w-full hover:bg-surface-container-high transition-colors active:scale-95 transition-transform" href="#">
<span class="material-symbols-outlined mb-1" data-icon="person">person</span>
<span class="font-label-sm text-label-sm">Account</span>
</a>
</nav>
</body></html>
